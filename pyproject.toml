[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distillschedule"
version = "0.1.0"
description = "A typed runtime and planning layer for multi-component DMD workloads"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "DistillSchedule contributors"}]
dependencies = []

[project.optional-dependencies]
config = ["omegaconf>=2.3"]
helios = ["omegaconf>=2.3"]
test = ["pytest>=7", "omegaconf>=2.3"]

[project.scripts]
distillctl = "distillschedule.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["distillschedule*"]
