[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distillschedule"
version = "0.2.0"
description = "A typed runtime and planning layer for multi-component DMD workloads"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "DistillSchedule contributors"}]
dependencies = []

[project.optional-dependencies]
config = ["omegaconf>=2.3"]
helios = ["omegaconf>=2.3"]
profiling = ["matplotlib>=3.7", "numpy>=1.24"]
test = ["pytest>=7", "omegaconf>=2.3"]
native = ["torch>=2.5", "safetensors>=0.4", "numpy>=1.24"]
native-wan = ["torch>=2.5", "safetensors>=0.4", "numpy>=1.24", "diffusers==0.35.2", "accelerate>=1.1,<2"]

[project.scripts]
distillctl = "distillschedule.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["distillschedule*"]
