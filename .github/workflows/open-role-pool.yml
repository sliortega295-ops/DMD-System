name: open-role-pool-cpu
on:
  push:
    branches: [agent/general-workload-planning-20261012]
    paths:
      - 'src/distillschedule/open_workload/role_*'
      - 'tests/test_open_workload_role_*'
      - '.github/workflows/open-role-pool.yml'
  pull_request:
    paths:
      - 'src/distillschedule/open_workload/role_*'
      - 'tests/test_open_workload_role_*'
      - '.github/workflows/open-role-pool.yml'
permissions:
  contents: read
jobs:
  cpu-role-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,native]'
      - name: Role graph and saved-state autograd
        env: {OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1'}
        run: python -m pytest -q tests/test_open_workload_role_program.py tests/test_open_workload_role_candidate_diversity.py tests/test_open_workload_role_offload.py tests/test_open_workload_role_async_contract.py
      - name: Real multiprocess P2P/VJP/pipeline and Score optimizer
        env: {OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1'}
        run: python -m pytest -q tests/test_open_workload_role_transport.py
      - name: Generator and Score pool FSDP2 with actual P2P/VJP/Adam reference
        env: {OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1'}
        run: python -m pytest -q tests/test_open_workload_role_sharding.py tests/test_open_workload_role_score_sharding.py tests/test_open_workload_role_trainable_score.py tests/test_open_workload_role_composition.py
      - name: Repeated Score commits preserve original input semantics and Adam
        env: {OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1'}
        run: python -m pytest -q tests/test_open_workload_role_updates.py
      - name: Calibrate then search via common solver, run chosen layout
        env: {OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1'}
        run: python -m pytest -q tests/test_open_workload_role_planning.py
      - name: Frozen Score and continuous model/Adam state with independent references
        env: {OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1'}
        run: python -m pytest -q tests/test_open_workload_role_memory.py tests/test_open_workload_role_continuous.py
      - name: Public unknown-workload CLI (torchrun -> calibrate -> select -> run)
        env: {OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1'}
        run: python -m pytest -q tests/test_open_workload_role_cli.py
      - name: Native component anchors and held-out FIFO prediction
        env: {OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1'}
        run: python -m pytest -q tests/test_open_workload_role_components.py tests/test_open_workload_role_prediction.py tests/test_open_workload_role_asymmetric_prediction.py tests/test_open_workload_role_dispatch.py
      - name: Preserve five canonical workload integration
        run: python scripts/distillschedule/check_best_known_integration.py
