name: strategy-integration
on:
  push:
    branches: [agent/strategy-native-integration-20261012]
  pull_request:
    paths:
      - 'src/distillschedule/strategies/**'
      - 'tests/test_strategy_*'
      - '.github/workflows/strategy-integration.yml'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - name: Source snapshot
        run: git archive --format=tar.gz HEAD > /tmp/strategy-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-source-${{ github.sha }}
          path: /tmp/strategy-source.tar.gz
          retention-days: 3
      - name: Existing typed-runtime regression
        run: python -m pytest -q tests/test_refactor_*.py
