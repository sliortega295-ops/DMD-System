name: official-models-cpu
on:
  pull_request:
    paths:
      - 'src/distillschedule/**'
      - 'tests/test_training_*.py'
      - 'tests/test_open_workload_*.py'
      - 'tests/test_framework_official_install.py'
      - 'tests/test_framework_flow_methods_ci.py'
      - 'tests/flow_replica_oracle.py'
      - 'tests/test_official_optimization_profiles.py'
      - 'tests/gpu/**'
      - 'tests/test_owner_execution_capability.py'
      - 'tests/test_owner_component_checkpoint.py'
      - 'tests/test_collective_owner_execution.py'
      - 'recipes/**'
      - 'scripts/check_cpu_receipt.py'
      - 'scripts/check_framework_install.py'
      - 'pyproject.toml'
      - '.github/workflows/official-models-cpu.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installed-official-lifecycle:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PYTHONPATH: 'src:.:tests'
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DMD_OFFICIAL_INSTALLED_CPU: '1'
      DMD2_SOURCE_ROOT: '${{ github.workspace }}/.framework-test-deps/dmd2'
      SELF_FORCING_SOURCE_ROOT: '${{ github.workspace }}/.framework-test-deps/self-forcing'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the compatible original-model CPU dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,test,dmd2,self-forcing-official]'
      - name: Fetch both locked source closures and licenses, never weights
        run: |
          python recipes/dmd2_sd15/fetch_source.py "$DMD2_SOURCE_ROOT" --with-test-oracle
          python recipes/self_forcing_official/fetch_source.py "$SELF_FORCING_SOURCE_ROOT"
      - name: Actual installed official image and video lifecycle outside checkout
        run: |
          python -m pytest -q tests/test_framework_official_install.py::test_actual_installed_official_sd15_sdxl_self_forcing_resume_export_new_inputs \
            --basetemp "${{ runner.temp }}/installed-official-tests" --junitxml=installed-official-cpu.xml
          python scripts/check_cpu_receipt.py installed-official-cpu.xml \
            --require test_actual_installed_official_sd15_sdxl_self_forcing_resume_export_new_inputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-official-cpu
          path: |
            installed-official-cpu.xml
            ${{ runner.temp }}/installed-official-tests/**/installed-official.json
          if-no-files-found: error
  public-resident-lifecycle:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: dmd2
            extra: 'train,test,dmd2'
            selection: 'not self_forcing'
          - family: official-self-forcing
            extra: 'train,test,self-forcing-official'
            selection: 'not sd15 and not sdxl'
    env:
      PYTHONPATH: 'src:.:tests'
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DMD2_SOURCE_ROOT: '${{ github.workspace }}/.framework-test-deps/dmd2'
      SELF_FORCING_SOURCE_ROOT: '${{ github.workspace }}/.framework-test-deps/self-forcing'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned provider CPU dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[${{ matrix.extra }}]'
      - name: Fetch the locked upstream source only
        run: |
          case '${{ matrix.family }}' in
            dmd2) python recipes/dmd2_sd15/fetch_source.py "$DMD2_SOURCE_ROOT" --with-test-oracle ;;
            official-self-forcing) python recipes/self_forcing_official/fetch_source.py "$SELF_FORCING_SOURCE_ROOT" ;;
          esac
      - name: Public direct, automatic and saved-plan native lifecycle
        run: |
          python -m pytest -q tests/test_training_resident_metadata.py tests/test_training_resident_lifecycle.py \
            -k '${{ matrix.selection }}' --junitxml=resident-public-cpu.xml
          case '${{ matrix.family }}' in
            dmd2)
              python scripts/check_cpu_receipt.py resident-public-cpu.xml \
                --require 'test_real_native_public_budget_policy_three_inputs[sd15-manual]' \
                --require 'test_real_native_public_budget_policy_three_inputs[sd15-auto]' \
                --require 'test_real_native_public_budget_policy_three_inputs[sdxl-manual]' \
                --require 'test_real_native_public_budget_policy_three_inputs[sdxl-auto]' \
                --require 'test_native_public_manual_fresh_process_checkpoint_resume[sd15]' \
                --require 'test_native_public_manual_fresh_process_checkpoint_resume[sdxl]' \
                --require 'test_native_manual_publication_failure_is_not_a_commit[sd15]' \
                --require 'test_native_manual_publication_failure_is_not_a_commit[sdxl]' \
                --require 'test_public_auto_saved_plan_and_resume_never_search_again[sd15]'
              ;;
            official-self-forcing)
              python scripts/check_cpu_receipt.py resident-public-cpu.xml \
                --require 'test_real_native_public_budget_policy_three_inputs[self_forcing-manual]' \
                --require 'test_real_native_public_budget_policy_three_inputs[self_forcing-auto]' \
                --require 'test_native_public_manual_fresh_process_checkpoint_resume[self_forcing]' \
                --require 'test_native_manual_publication_failure_is_not_a_commit[self_forcing]'
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-resident-cpu-${{ matrix.family }}
          path: resident-public-cpu.xml
          if-no-files-found: error
  actual-model-classes:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: dmd2
            extra: 'train,test,dmd2'
          - family: official-self-forcing
            extra: 'train,test,self-forcing-official'
          - family: ltx25
            extra: 'train,test,ltx25'
          - family: livewan-public
            extra: 'train,test,livewan-wan21-reference'
    env:
      PYTHONPATH: 'src:.:tests'
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DMD2_SOURCE_ROOT: '${{ github.workspace }}/.framework-test-deps/dmd2'
      SELF_FORCING_SOURCE_ROOT: '${{ github.workspace }}/.framework-test-deps/self-forcing'
      LTX_SOURCE_ROOT: '${{ github.workspace }}/.framework-test-deps/ltx25'
      DMD_WAN21_TEST_UPSTREAM: '${{ github.workspace }}/.framework-test-deps/wan21-codec'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimum CPU runtime in a provider-specific job
        run: |
          if [ '${{ matrix.family }}' = ltx25 ]; then
            python -m pip install torch==2.10.0 torchaudio==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install -e '.[${{ matrix.extra }}]'
      - name: Explicitly fetch only the hash-locked source closure and license, never weights
        run: |
          case '${{ matrix.family }}' in
            dmd2) python recipes/dmd2_sd15/fetch_source.py "$DMD2_SOURCE_ROOT" --with-test-oracle ;;
            official-self-forcing) python recipes/self_forcing_official/fetch_source.py "$SELF_FORCING_SOURCE_ROOT" ;;
            ltx25) python recipes/ltx25/fetch_source.py "$LTX_SOURCE_ROOT" ;;
            livewan-public) python recipes/self_forcing/fetch_wan21_codec.py "$DMD_WAN21_TEST_UPSTREAM" ;;
          esac
      - name: Actual upstream small classes, native math and new-process lifecycle
        run: |
          case '${{ matrix.family }}' in
            dmd2)
              python -m pytest -q tests/test_training_dmd2_*.py tests/test_training_official_dmd2_*.py tests/test_official_optimization_profiles.py tests/test_training_sd_binding.py tests/test_owner_execution_capability.py tests/test_owner_component_checkpoint.py tests/test_collective_owner_execution.py tests/test_training_native_owner_profiles.py --junitxml=provider-cpu.xml
              python scripts/check_cpu_receipt.py provider-cpu.xml \
                --require test_explicit_cpu_rng_capture_and_seed_do_not_inspect_cuda \
                --require test_real_native_guidance_bundle_rebuilds_after_commits_and_drains \
                --require test_mixed_vae_inference_projection_round_trip \
                --require test_real_cpu_fsdp_local_shards_and_adam_checkpoint \
                --require test_actual_native_sd15_local_shard_continuation \
                --require test_actual_native_classifier_uses_hooks_with_identical_loss_gradient_rng \
                --require test_actual_fsdp_factory_admits_before_sharding_and_cleans_failures \
                --require 'test_actual_factory_managed_scope_closes_real_native_hooks[False]' \
                --require 'test_actual_factory_managed_scope_closes_real_native_hooks[True]' \
                --require 'test_actual_owner_host_checkpoint_restores_moments_and_parameter_ownership[sd15]' \
                --require 'test_actual_owner_host_checkpoint_restores_moments_and_parameter_ownership[sdxl]' \
                --require 'test_direct_source_native_iterations_match_owner_losses_gradients_cache_and_clocks[sd15]' \
                --require 'test_direct_source_native_iterations_match_owner_losses_gradients_cache_and_clocks[sdxl]' \
                --require 'test_common_program_new_process_restart_and_inference_only_current_export[sd15]' \
                --require 'test_common_program_new_process_restart_and_inference_only_current_export[sdxl]'
              ;;
            official-self-forcing)
              python -m pytest -q tests/test_training_self_forcing_*.py tests/test_training_official_sf_*.py tests/test_official_optimization_profiles.py --junitxml=provider-cpu.xml
              python scripts/check_cpu_receipt.py provider-cpu.xml \
                --require test_native_plain_inventory_dtypes_alias_optimizer_and_host_ema \
                --require test_actual_upstream_rms_runs_without_public_wan_alias_and_keeps_canaries \
                --require test_placement_preserves_explicit_fp64_schedule_and_complex128_rope \
                --require test_math_attention_clones_packed_cache_reads_and_rejects_cross_device_inputs \
                --require test_prompt_only_is_original_local_native_t5_not_a_synthetic_conditioner \
                --require test_raw_native_t5_prompt_streams_reach_real_training_and_video \
                --require test_source_trainer_oracle_loss_gradient_adam_ema_cache_rng_and_native_clocks \
                --require test_fresh_process_common_program_restart_current_g_export
              ;;
            ltx25)
              python -m pytest -q tests/test_training_dmd_flow.py tests/test_training_ltx_*.py --junitxml=provider-cpu.xml
              python scripts/check_cpu_receipt.py provider-cpu.xml \
                --require test_real_native_media_text_and_modality_abi \
                --require test_native_cpu_media_never_probes_visible_cuda \
                --require 'test_current_g_export_only_raw_prompt_prepare_and_av_generate[config]' \
                --require 'test_current_g_export_only_raw_prompt_prepare_and_av_generate[lora_config]' \
                --require 'test_fresh_process_exact_resume_and_current_generator_av_export[config]' \
                --require 'test_fresh_process_exact_resume_and_current_generator_av_export[lora_config]' \
                --require test_actual_measured_ltx_policy_preserves_all_updates \
                --require test_public_ltx_auto_saved_plan_and_new_process_resume \
                --require test_ltx_unqualified_pretrained_trials_refuse_before_copy
              ;;
            livewan-public)
              python -m pytest -q tests/test_training_livewan_reference_inputs.py tests/test_training_livewan_public_cpu.py tests/test_training_livewan_inference_cpu.py --junitxml=provider-cpu.xml
              python scripts/check_cpu_receipt.py provider-cpu.xml \
                --require test_current_g_exact_fresh_process_after_all_training_assets_and_owners_removed \
                --require test_actual_original_codec_21_to81_uint8_exact_native_decode_once_no_raw_clamp \
                --require test_cli_actual_original_optional_video_parameter_and_no_fallback
              ;;
          esac
      - name: Actual LTX model-owned flow boundary
        if: ${{ matrix.family == 'ltx25' }}
        env:
          DMD_MODERN_FLOW_CPU: '1'
        run: |
          python -m pytest -q \
            'tests/test_training_flow_model_methods.py::test_native_direct_entry_current_owner_no_copy_and_exact_census[ltx25]' \
            'tests/test_training_flow_model_methods.py::test_native_exact_sequential_trace_at_new_entry[ltx25-reuse_student-all_steps-False-False]' \
            'tests/test_training_flow_model_methods.py::test_native_exact_sequential_trace_at_new_entry[ltx25-reuse_student-last_step-True-True]' \
            'tests/test_training_flow_model_methods.py::test_native_exact_sequential_trace_at_new_entry[ltx25-fresh_student-all_steps-True-False]' \
            'tests/test_training_flow_model_methods.py::test_native_exact_sequential_trace_at_new_entry[ltx25-fresh_student-last_step-False-False]' \
            'tests/test_training_flow_model_methods.py::test_native_rank_namespaces_and_local_gradients_match_existing_b1_oracle[ltx25]' \
            'tests/test_training_flow_model_methods.py::test_native_clock_refusal_precedes_outer_and_native_forward[ltx25]' \
            'tests/test_training_flow_model_methods.py::test_native_complete_cycle_new_process_resume_is_exact[ltx25]' \
            --junitxml=ltx-flow-methods-cpu.xml
          python scripts/check_cpu_receipt.py ltx-flow-methods-cpu.xml \
            --require 'test_native_direct_entry_current_owner_no_copy_and_exact_census[ltx25]' \
            --require 'test_native_exact_sequential_trace_at_new_entry[ltx25-reuse_student-all_steps-False-False]' \
            --require 'test_native_exact_sequential_trace_at_new_entry[ltx25-reuse_student-last_step-True-True]' \
            --require 'test_native_exact_sequential_trace_at_new_entry[ltx25-fresh_student-all_steps-True-False]' \
            --require 'test_native_exact_sequential_trace_at_new_entry[ltx25-fresh_student-last_step-False-False]' \
            --require 'test_native_rank_namespaces_and_local_gradients_match_existing_b1_oracle[ltx25]' \
            --require 'test_native_clock_refusal_precedes_outer_and_native_forward[ltx25]' \
            --require 'test_native_complete_cycle_new_process_resume_is_exact[ltx25]'
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.family == 'ltx25' }}
        with:
          name: ltx-flow-methods-cpu
          path: ltx-flow-methods-cpu.xml
          if-no-files-found: error
      - name: Actual LTX CPU FSDP flow ownership
        if: ${{ matrix.family == 'ltx25' }}
        env:
          DMD_MODERN_FLOW_CPU: '1'
        run: |
          python -m pytest -q \
            'tests/test_open_workload_parameter_shadows.py::test_native_full_shadow_oracle_and_fresh_process_checkpoint[ltx25-fsdp2_reshard]' \
            'tests/test_open_workload_parameter_shadows.py::test_native_full_shadow_oracle_and_fresh_process_checkpoint[ltx25-fsdp2_keep_forward]' \
            'tests/test_open_workload_frozen_roots.py::test_private_native_flow_frozen_teacher_G1_F5[ltx25-fsdp2_reshard]' \
            'tests/test_open_workload_frozen_roots.py::test_private_native_flow_frozen_teacher_G1_F5[ltx25-fsdp2_keep_forward]' \
            'tests/test_training_flow_owned_generation.py::test_native_owned_generation_restored_current_student_and_closed_groups[ltx25-fsdp2_reshard]' \
            'tests/test_training_flow_owned_generation.py::test_native_owned_generation_restored_current_student_and_closed_groups[ltx25-fsdp2_keep_forward]' \
            --junitxml=ltx-flow-sharding-cpu.xml
          python scripts/check_cpu_receipt.py ltx-flow-sharding-cpu.xml \
            --require 'test_native_full_shadow_oracle_and_fresh_process_checkpoint[ltx25-fsdp2_reshard]' \
            --require 'test_native_full_shadow_oracle_and_fresh_process_checkpoint[ltx25-fsdp2_keep_forward]' \
            --require 'test_private_native_flow_frozen_teacher_G1_F5[ltx25-fsdp2_reshard]' \
            --require 'test_private_native_flow_frozen_teacher_G1_F5[ltx25-fsdp2_keep_forward]' \
            --require 'test_native_owned_generation_restored_current_student_and_closed_groups[ltx25-fsdp2_reshard]' \
            --require 'test_native_owned_generation_restored_current_student_and_closed_groups[ltx25-fsdp2_keep_forward]'
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.family == 'ltx25' }}
        with:
          name: ltx-flow-sharding-cpu
          path: ltx-flow-sharding-cpu.xml
          if-no-files-found: error
      - name: Separate optional actual-CUDA receipt, never part of mandatory CPU proof
        run: |
          # Root test_training_* globs above do not collect tests/gpu. CPU Torch
          # records honest skips here (CUDA NOT_RUN), not CPU acceptance.
          case '${{ matrix.family }}' in
            dmd2) python -m pytest -q tests/gpu/test_training_dmd2_lifecycle.py --junitxml=optional-cuda.xml ;;
            official-self-forcing) python -m pytest -q tests/gpu/test_training_self_forcing_lifecycle.py --junitxml=optional-cuda.xml ;;
            ltx25) DMD_CUDA_IMMUTABLE_SHARING=1 python -m pytest -q tests/gpu/test_training_ltx_lifecycle.py --junitxml=optional-cuda.xml ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-model-cpu-${{ matrix.family }}
          path: |
            provider-cpu.xml
            optional-cuda.xml
          if-no-files-found: error
