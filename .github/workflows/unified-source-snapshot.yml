name: unified-source-snapshot
on:
  push:
    branches: [agent/unified-strategy-planner-20261012]
    paths: [.github/workflows/unified-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > /tmp/unified-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: unified-source-${{ github.sha }}
          path: /tmp/unified-source.tar.gz
          retention-days: 3
