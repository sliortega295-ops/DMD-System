name: native-source-snapshot
on:
  push:
    branches: [agent/parameterized-native-backend-20261011]
    paths: [.github/workflows/native-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > /tmp/native-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: native-source-${{ github.sha }}
          path: /tmp/native-source.tar.gz
          retention-days: 3
