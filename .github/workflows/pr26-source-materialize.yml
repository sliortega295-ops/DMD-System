name: pr26-source-materialize
on:
  push:
    branches: [agent/integrate-five-workload-winners-20260905]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integrate-five-workload-winners-20260905
          fetch-depth: 0
      - name: Rebuild exact final integration tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "agent/integrate-five-workload-winners-20260905"

          cat tools/pr26-owned-payload.part* > /tmp/owned.b64
          base64 -d /tmp/owned.b64 > /tmp/owned.tar.gz
          echo '1024957fea802cfa4b15b4a05e4fe7471eb75e939c98fbdf7178f0bca60675a3  /tmp/owned.tar.gz' | sha256sum -c -
          python - <<'PYEXTRACT'
          import tarfile
          from pathlib import Path
          archive = Path('/tmp/owned.tar.gz')
          root = Path('.').resolve()
          with tarfile.open(archive, 'r:gz') as tf:
              for member in tf.getmembers():
                  target = (root / member.name).resolve()
                  if not str(target).startswith(str(root) + '/'):
                      raise SystemExit(f'unsafe archive path: {member.name}')
              tf.extractall(root)
          PYEXTRACT

          for sha in \
            67b2880901abece947732ba5de45a5c2685ab274 \
            ad9e16b83800463c069e87b562f2d07a41bbeab3 \
            d865cdc0e5d7ee99fbe6102a5965de08c8c81b9d \
            c2a1ee389f7fe93dd9c289ab32068e41e5b9a90b; do
            git fetch --no-tags origin "$sha"
          done

          rm -rf /tmp/h3
          git clone --quiet https://github.com/sliortega295-ops/H3-DMD-for-A100.git /tmp/h3
          git -C /tmp/h3 checkout --quiet cfecbb4188e1f3820451657f744aa2c823e24da4

          python - <<'PYMATERIALIZE'
          import hashlib, json, stat, subprocess
          from pathlib import Path

          repo = Path('.').resolve()
          h3 = Path('/tmp/h3')
          spec = json.loads((repo / 'docs/workloads/source_import_map.json').read_text())

          def run(cmd, cwd=None):
              return subprocess.check_output(cmd, cwd=cwd, stderr=subprocess.STDOUT)

          for row in spec['files']:
              target = repo / row['target']
              target.parent.mkdir(parents=True, exist_ok=True)
              source_repo = row['source_repository']
              source_commit = row['source_commit']
              source_path = row['source_path']

              if source_repo == 'sliortega295-ops/DMD-System':
                  data = run(['git', 'show', f'{source_commit}:{source_path}'], cwd=repo)
                  mode_line = run(['git', 'ls-tree', source_commit, '--', source_path], cwd=repo).decode().strip()
              elif source_repo == 'sliortega295-ops/H3-DMD-for-A100':
                  data = run(['git', 'show', f'{source_commit}:{source_path}'], cwd=h3)
                  mode_line = run(['git', 'ls-tree', source_commit, '--', source_path], cwd=h3).decode().strip()
              elif source_repo == 'integration-pr26':
                  if not target.is_file():
                      raise SystemExit(f'missing integration-owned target: {row["target"]}')
                  data = target.read_bytes()
                  mode_line = ''
              else:
                  raise SystemExit(f'unknown source_repository: {source_repo}')

              if source_repo != 'integration-pr26':
                  target.write_bytes(data)
                  mode = mode_line.split()[0] if mode_line else '100644'
                  current = target.stat().st_mode
                  if mode == '100755':
                      target.chmod(current | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
                  else:
                      target.chmod(current & ~(stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH))

              got = hashlib.sha256(target.read_bytes()).hexdigest()
              if got != row['integrated_sha256']:
                  raise SystemExit(f'hash mismatch {row["target"]}: {got} != {row["integrated_sha256"]}')
          print(f'materialized_and_verified={len(spec["files"])}')
          PYMATERIALIZE

          git rm -f .github/workflows/pr26-source-materialize.yml tools/pr26-owned-payload.part*
          git add -A
          git update-index --add --cacheinfo 160000,d034a6b0ecaa31aa07c81aeb7bbe69b225f1d7be,third_party/lightx2v
          git update-index --add --cacheinfo 160000,1eabf43c777bc5b2816926ca998cd4e4c2dfa3d5,third_party/livewan
          git update-index --add --cacheinfo 160000,9737cba9c1c3c4d04b33fcad41c111989865d315,third_party/wan21

          tree="$(git write-tree)"
          test "$tree" = '98b2092b382f52a3ab2c5eb7b74d441b29e67b23'

          PYTHONPATH=src:. python scripts/distillschedule/check_best_known_integration.py
          PYTHONPATH=src:. python -m unittest discover -s tests -p test_refactor_best_known.py -v

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete five-workload canonical integration'
          test "$(git show -s --format=%T HEAD)" = '98b2092b382f52a3ab2c5eb7b74d441b29e67b23'
          git push origin HEAD:agent/integrate-five-workload-winners-20260905
