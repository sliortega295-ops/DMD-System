name: apply-wan-checkpoints
on:
  push:
    branches: [agent/strategy-native-integration-20261012]
    paths: ['checkpoints/wan/**', '.github/workflows/apply-wan-checkpoints.yml']
permissions:
  contents: write
concurrency:
  group: apply-wan-checkpoints
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/distillschedule/apply_wan_checkpoint.py apply
      - run: python -m pip install -e '.[test]'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Original-protocol parameterization tests
        run: python -m pytest -q tests/test_refactor_strategy_*.py tests/test_strategy_*.py --junitxml=wan-checkpoint-tests.xml
      - name: Canonical source and integration checks
        run: python scripts/distillschedule/check_best_known_integration.py
      - name: Publish only after successful validation (never force-push)
        run: python scripts/distillschedule/apply_wan_checkpoint.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wan-checkpoint-tests-${{ github.sha }}
          path: wan-checkpoint-tests.xml
          retention-days: 14
