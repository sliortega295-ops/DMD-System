name: h3-grid-output-cpu
on:
  pull_request:
    paths:
      - 'src/distillschedule/**'
      - 'tests/test_training_h3_grid*.py'
      - 'tests/test_h3_grid_codec_target_cpu.py'
      - 'tests/fixtures/h3_grid_output_source.*'
      - 'tests/test_framework_cpu_collection.py'
      - 'scripts/prepare_h3_grid_output_test_source.py'
      - 'scripts/check_cpu_receipt.py'
      - 'pyproject.toml'
      - '.github/workflows/h3-grid-output-cpu.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  original-grid-output:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONPATH: 'src:.:tests'
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DMD_H3_TEST_UPSTREAM: '${{ github.workspace }}/.framework-test-deps/lightx2v-grid-output'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ModelTC/LightX2V
          ref: d034a6b0ecaa31aa07c81aeb7bbe69b225f1d7be
          path: .framework-test-deps/lightx2v-grid-output
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: huggingface/diffusers
          ref: 9284607295a09f759aadd65ed08f48b35feea6d9
          path: .framework-test-deps/diffusers
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU Torch and the independent exact converted-model source
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,test,test-h3-output]' .framework-test-deps/diffusers
          python -m pip check
      - name: Reproduce the existing reviewed Grid inference source identity
        run: python scripts/prepare_h3_grid_output_test_source.py "$DMD_H3_TEST_UPSTREAM"
      - name: Actual converted model, original sampler and current Student outputs
        run: |
          python -m pytest -q tests/test_training_h3_grid_outputs.py tests/test_training_h3_grid_native_outputs.py --junitxml=h3-grid-output-cpu.xml
          python scripts/check_cpu_receipt.py h3-grid-output-cpu.xml \
            --require test_grid_original_source_schedule_and_projection_identity \
            --require test_actual_grid_export_restore_four_step_rollout_matches_original_projection \
            --require test_grid_public_export_and_new_process_generate \
            --require test_real_current_grid_callback_common_export_and_source_guard \
            --require test_actual_checkpoint_restore_precedes_output_and_performs_zero_updates \
            --require test_real_gloo_dtensor_export_gathers_all_current_weight_shards
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-grid-output-cpu
          path: h3-grid-output-cpu.xml
          if-no-files-found: error
