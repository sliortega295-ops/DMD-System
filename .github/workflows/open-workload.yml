name: open-workload
on:
  push:
    branches: [agent/general-workload-planning-20261012]
  pull_request:
    paths:
      - 'src/distillschedule/workloads/program.py'
      - 'src/distillschedule/open_workload/**'
      - 'src/distillschedule/core/enums.py'
      - 'tests/test_open_workload*'
      - '.github/workflows/open-workload.yml'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test,native]' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Probe actual CPU attention checkpoint dispatch (no model downloads)
        run: |
          python - <<'PYTORCH'
          import torch
          from torch.nn import functional as F
          from torch.utils._python_dispatch import TorchDispatchMode
          from torch.utils.checkpoint import checkpoint, CheckpointPolicy, create_selective_checkpoint_contexts
          class Observe(TorchDispatchMode):
              def __init__(self): super().__init__(); self.ops={}
              def __torch_dispatch__(self, func, types, args=(), kwargs=None):
                  key=str(func)
                  self.ops[key]=self.ops.get(key,0)+1
                  return func(*args,**(kwargs or {}))
          print('torch',torch.__version__,flush=True)
          x=torch.randn(2,1,7,8)
          w=torch.nn.Parameter(torch.randn(8,8))
          seen=[]
          def choose(ctx,op,*a,**kw):
              if 'attention' in str(op): seen.append((ctx.is_recompute,str(op)))
              return CheckpointPolicy.MUST_SAVE if 'attention' in str(op) else CheckpointPolicy.PREFER_RECOMPUTE
          def f(x):
              q=x@w
              return F.scaled_dot_product_attention(q,q,q).sin()
          with Observe() as observer:
              y=checkpoint(f,x,use_reentrant=False,context_fn=lambda:create_selective_checkpoint_contexts(choose))
              y.square().mean().backward()
          print('attention_dispatch', sorted((k,v) for k,v in observer.ops.items() if 'attention' in k or 'bmm' in k),flush=True)
          print('attention_policy_calls',seen,flush=True)
          PYTORCH
      - run: python -m pytest -q tests/test_open_workload* --junitxml=open-workload.xml
      - run: python scripts/distillschedule/check_best_known_integration.py
      - name: Save source and test checkpoints
        if: always()
        run: git archive --format=tar.gz HEAD > open-workload-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-workload-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            open-workload.xml
            open-workload-source.tar.gz
          retention-days: 3
