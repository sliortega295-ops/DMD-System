name: open-workload-distributed
on:
  push:
    branches: [agent/general-workload-planning-20261012]
    paths:
      - 'src/distillschedule/open_workload/**'
      - 'src/distillschedule/workloads/program.py'
      - 'tests/test_open_workload*'
      - '.github/workflows/open-workload-distributed.yml'
  pull_request:
    paths:
      - 'src/distillschedule/open_workload/**'
      - 'src/distillschedule/workloads/program.py'
      - 'tests/test_open_workload*'
      - '.github/workflows/open-workload-distributed.yml'
permissions:
  contents: read
concurrency:
  group: open-distributed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve exact source for incremental development
        run: git archive --format=tar.gz HEAD > /tmp/open-workload-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: open-workload-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/open-workload-source.tar.gz
          retention-days: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,native]'
      - name: Generic workload regressions (CPU; not GPU performance)
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m pytest -q tests/test_open_workload* --junitxml=open-distributed.xml
      - name: Preserve canonical workload integration
        run: python scripts/distillschedule/check_best_known_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-distributed-tests-${{ github.event.pull_request.head.sha || github.sha }}
          path: open-distributed.xml
          retention-days: 7
