name: refactor-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typed-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile typed and validated runtime source
        run: python -m compileall -q src runtime scripts/distillctl.py scripts/distillschedule
      - name: Validate shell launchers
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Focused typed-runtime tests
        shell: bash
        run: |
          mapfile -t TESTS < <(find tests -maxdepth 1 -type f -name 'test_refactor_*.py' ! -name 'test_refactor_fsdp2_p0.py' | sort)
          test "${#TESTS[@]}" -gt 0
          pytest -q "${TESTS[@]}"
      - name: Validate generic plan
        run: python scripts/distillctl.py validate configs/distillschedule/plans/generic_autoregressive_dmd_vllm_critic_only.json
