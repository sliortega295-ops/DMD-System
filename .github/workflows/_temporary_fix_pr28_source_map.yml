name: temporary-fix-pr28-source-map
on:
  push:
    branches: [agent/dmd-joint-planner-20260907]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dmd-joint-planner-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inventory reviewed-source drift
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          doc = json.loads(Path('docs/workloads/source_import_map.json').read_text())
          mismatches=[]
          for row in doc['files']:
              p=Path(row['target'])
              if not p.is_file():
                  mismatches.append(dict(target=row['target'], reviewed=row.get('integrated_sha256'), actual='MISSING', last_commit='MISSING'))
                  continue
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              reviewed=row.get('integrated_sha256')
              if actual != reviewed:
                  last=subprocess.check_output(['git','log','-1','--format=%H','--',row['target']], text=True).strip()
                  mismatches.append(dict(target=row['target'], reviewed=reviewed, actual=actual, last_commit=last))
          print(json.dumps({'count':len(mismatches),'mismatches':mismatches}, indent=2, sort_keys=True))
          if not mismatches:
              raise SystemExit(0)
          raise SystemExit(3)
          PY
