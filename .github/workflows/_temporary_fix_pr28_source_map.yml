name: temporary-fix-pr28-source-map
on:
  push:
    branches: [agent/dmd-joint-planner-20260907]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dmd-joint-planner-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply audited source adaptations and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          changes = {
            'src/distillschedule/backends/training/minimax_h3/integrated_entrypoint.py': ('f804134d24bce6520822ee063610ad55387e1527a52125a25147939bb8100b96','7560c4f89a133f984bc712eecf30d8a17c568930bfab16d38da323fd12735202','878aff490ce28c661ac1d927f08f8846992baf45','Bind generated H3 action windows to native helpers and preserve one-shot failure-prefix receipts; canonical H3 training math and winner profile unchanged.'),
            'src/distillschedule/backends/training/minimax_h3/trainer_loop.py': ('ad15a07aa563b278943c7c59f7cf5d6694f94387ab519cf495dbe7dea4d1d28b','a63e3d18a129cd3a12dd5e6601d6a3777ebb91d726b62932a4cde341c71fc17e','878aff490ce28c661ac1d927f08f8846992baf45','Bind generated H3 action windows to existing Student/Fake native helpers and actual RNG evidence; canonical H3 winner profile unchanged.'),
            'scripts/distillschedule/launch_static_fsdp2_p0_world16_node.sh': ('4103bab06079e57bd8ed1f294370bf300c292778338e0f02ee79b1ea2a1226f0','15afebdd1fc10a0e1ad3b34b111f9d6dc784e3e74f2a2c0954c18eb47e2c841f','85be7e4e36dea31bdc01bcfe8faf3d67efb58494','Record fail-closed post-worker GPU ownership/teardown evidence; training math and canonical Helios profiles unchanged.'),
            'scripts/distillschedule/probe_static_fsdp2_p0_world16.py': ('24fe6a5ede551af63d19fd4360de9997dd0c1c6dd853f1f3157d5c221a9258f9','a59e54758bcd9d722ad4473ce1855b77a3f4a442229033a73d72ceb5584b9bb2','5171065c6efc558fe4d7d394a2fb2976bb5c6b31','Connect Helios variants to opt-in measured component plans and native two-cycle execution; canonical helpers/profiles/results unchanged.'),
            'scripts/distillschedule/probe_static_fsdp2_p0_world16_hardened.py': ('3700a46b8aaf4981728272db1686b42727c2d9c5060368c5f26e6597b52f097f','8af7899d9686cfa75880f009e38acf41305be73d515e6bafcd38e2212196b457','5171065c6efc558fe4d7d394a2fb2976bb5c6b31','Connect hardened Helios native worker to opt-in measured component plans; canonical helpers/profiles/results unchanged.'),
            'scripts/distillschedule/launch_livewan_crossscale_world16_node.sh': ('0094534ad674d8c17c1a1ae748043dca6950c5b9263c7349a09cce17d3325007','c50f9141c17c2f9e20cfb46b80384fb7686c7a8951ed372b133566910fef53af','78e501bc1727013d94e356f697051b4d11cba4be','Allow source/identity action observation through the existing two-cycle trajectory gate without granting timing authority; canonical LiveWan profile unchanged.'),
            'scripts/distillschedule/launch_minimax_h3_best_node.sh': ('7f68fc93234bb39681a4ae97f3bfcb43118a4af109a831b49a8fd7e8c5929f1c','a95ed4b8479e0d101b05c84d6c341bb258dff66d8d7aeb1eb9fd1ecaf4a194b5','d730a89b11efe21074f411a865b3feda44f818f3','Gate H3 prepared-action calibration/native timing while preserving the canonical H3 invocation and winner profile.'),
            'src/distillschedule/workloads/best_known/dispatch.py': ('e4a2ce254ecc0bd6a0d549c9a95f1097e25e265a26161082ddc4debd182132d5','d891c6496a70a761867c2da1b685ec4347dec2c6dbc432ba167dac5f6526b16a','5171065c6efc558fe4d7d394a2fb2976bb5c6b31','Route opt-in Helios measured component/native plans through existing best-known dispatch without altering canonical profiles.'),
            'src/distillschedule/workloads/best_known/evidence.py': ('33315d6479e46aec84c6ba9f2542e1a201fd6b8bf80575da2e2d29d8b204fae3','63f1d0bc95dde055ddbfab46af216deef49c2bb473324c500b3e638810e0eff2','5171065c6efc558fe4d7d394a2fb2976bb5c6b31','Validate opt-in Helios native evidence/receipts while retaining REVIEW claim boundaries and unchanged canonical results.'),
            'src/distillschedule/workloads/best_known/registry.py': ('ce9b0fcc1b19c56f8487eb2120b23dd781c9ac61d84bbd8ab0dac01301077ca8','7fc6a33383c9a6c10983ae393fbe8c26754af8e6a3056e62a36f6d84ddd4da49','5171065c6efc558fe4d7d394a2fb2976bb5c6b31','Expose opt-in Helios native planning modes in registry resolution; five canonical profile definitions/results remain unchanged.'),
          }
          path=Path('docs/workloads/source_import_map.json')
          doc=json.loads(path.read_text())
          by_target={r.get('target'):r for r in doc['files']}
          for target,(previous,current,commit,reason) in changes.items():
              p=Path(target)
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              if actual != current:
                  raise SystemExit(f'{target}: actual {actual} != audited {current}')
              last=subprocess.check_output(['git','log','-1','--format=%H','--',target],text=True).strip()
              if last != commit:
                  raise SystemExit(f'{target}: last commit {last} != audited {commit}')
              row=by_target[target]
              if row['integrated_sha256'] not in {previous,current}:
                  raise SystemExit(f'{target}: unexpected reviewed hash {row["integrated_sha256"]}')
              item={'base_integration_head': row.get('adaptations', [{}])[-1].get('source_commit', row.get('source_commit')),
                    'new_integrated_sha256':current,'previous_integrated_sha256':previous,
                    'reason':reason,'source_commit':commit}
              if not any(a.get('source_commit')==commit and a.get('new_integrated_sha256')==current for a in row.setdefault('adaptations',[])):
                  row['adaptations'].append(item)
              row['integrated_sha256']=current
          path.write_text(json.dumps(doc,indent=2,sort_keys=True)+'\n')
          PY
          python scripts/distillschedule/check_best_known_integration.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/workloads/source_import_map.json
          git commit -m 'fix(integration): audit recent native planner source adaptations'
          git push origin HEAD:agent/dmd-joint-planner-20260907
