name: lightx2v-minimax-contract

on:
  pull_request:
    paths:
      - ".gitmodules"
      - "third_party/lightx2v"
      - "third_party/lightx2v_benchmark/**"
      - "configs/distillschedule/baselines/lightx2v_minimax_h3_world16_dmd*"
      - "runtime/lightx2v_minimax_matched.py"
      - "runtime/lightx2v_segmented_checkpoint.py"
      - "scripts/distillschedule/*lightx2v_minimax*"
      - "docs/design/lightx2v_minimax_dmd_world16_baseline.md"
      - "docs/runbooks/baai_lightx2v_minimax.md"
      - "tests/test_refactor_lightx2v_minimax.py"
      - "tests/test_refactor_lightx2v_segmented_checkpoint.py"
      - ".github/workflows/lightx2v-minimax-contract.yml"

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify pinned upstream and benchmark patch
        run: |
          test "$(git -C third_party/lightx2v rev-parse HEAD)" = "d034a6b0ecaa31aa07c81aeb7bbe69b225f1d7be"
          echo "89935efd36d8a149f121b428cad700363d987918718b81b1ea56b887f196d9c3  third_party/lightx2v_benchmark/benchmark.patch" | sha256sum -c -
          git -C third_party/lightx2v apply --check "$GITHUB_WORKSPACE/third_party/lightx2v_benchmark/benchmark.patch"
      - name: Static launcher checks
        run: |
          bash -n scripts/distillschedule/prepare_lightx2v_minimax.sh
          bash -n scripts/distillschedule/launch_lightx2v_minimax_world16_node.sh
          python -m py_compile \
            scripts/distillschedule/run_lightx2v_minimax_world16.py \
            scripts/distillschedule/summarize_lightx2v_minimax_world16.py \
            scripts/distillschedule/compare_lightx2v_minimax_helios.py
      - name: Contract tests
        run: |
          python -m pip install pytest
          pytest -q tests/test_refactor_lightx2v_minimax.py
      - name: Segmented checkpoint semantic tests
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          pytest -q tests/test_refactor_lightx2v_segmented_checkpoint.py
