name: generic-workload-programs
on:
  push:
    branches: [agent/generic-workload-capabilities-20261012]
  pull_request:
    paths:
      - 'src/distillschedule/programs/**'
      - 'tests/test_program_*.py'
      - '.github/workflows/generic-programs.yml'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,native]'
      - run: python -m pytest -q tests/test_program_*.py --junitxml=programs.xml
      - run: python scripts/distillschedule/check_best_known_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: program-cpu-${{ github.event.pull_request.head.sha || github.sha }}
          path: programs.xml
