name: original-livewan-inputs-cpu
on:
  pull_request:
    paths:
      - 'src/distillschedule/training/**'
      - 'src/distillschedule/runtime/livewan_crossscale_worker.py'
      - 'tests/test_training_livewan_inputs.py'
      - 'pyproject.toml'
      - '.github/workflows/livewan-native-inputs-cpu.yml'
  push:
    branches: [main, codex/open-source-framework-20261021]
permissions:
  contents: read
jobs:
  original-data-owner:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: 'src:.'
      DMD_LIVEWAN_TEST_UPSTREAM: '${{ github.workspace }}/third_party/livewan'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the pinned original dataset, not model weights
        run: git submodule update --init --depth 1 third_party/livewan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install CPU data and checkpoint dependencies
        run: python -m pip install -e '.[train,test]'
      - name: Actual TeacherLatents to native InputLoader and data cursor
        run: python -m pytest -q tests/test_training_livewan_inputs.py --junitxml=livewan-inputs-cpu.xml
      - name: Require actual-source execution, not a skipped qualification
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('livewan-inputs-cpu.xml').getroot().iter('testcase'))
          assert cases and all(case.find('skipped') is None for case in cases)
          assert all(case.find('failure') is None and case.find('error') is None for case in cases)
          names = {case.get('name') for case in cases}
          assert {'test_actual_original_and_real_input_loader_roundtrip',
                  'test_complete_cohorts_rank_cursor_checkpoint_seek_and_rng',
                  'test_historical_default_prefix_behavior_is_unchanged'} <= names
          assert sum(name.startswith('test_malicious_archive_refused_before_original_unsafe_loading[')
                     for name in names) == 2
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-livewan-inputs-cpu-${{ github.sha }}
          path: livewan-inputs-cpu.xml
