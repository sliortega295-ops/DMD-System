name: original-livewan-inputs-cpu
on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'third_party/livewan'
      - 'third_party/wan21'
      - 'src/distillschedule/data/**'
      - 'src/distillschedule/training/**'
      - 'src/distillschedule/runtime/livewan_crossscale_worker.py'
      - 'src/distillschedule/runtime/livewan_context_staging.py'
      - 'src/distillschedule/search/livewan_request.py'
      - 'src/distillschedule/workloads/livewan_crossscale.py'
      - 'src/distillschedule/workloads/best_known/registry.py'
      - 'tests/test_data_cli.py'
      - 'tests/test_refactor_livewan_context_staging.py'
      - 'tests/test_training_livewan_inputs.py'
      - 'tests/test_training_livewan_state.py'
      - 'tests/test_training_livewan_reference.py'
      - 'tests/test_training_livewan_reference_distributed.py'
      - 'tests/test_training_native_state.py'
      - 'pyproject.toml'
      - '.github/workflows/livewan-native-inputs-cpu.yml'
  push:
    branches: [main, codex/open-source-framework-20261021]
permissions:
  contents: read
jobs:
  original-data-owner:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: 'src:.'
      DMD_LIVEWAN_TEST_UPSTREAM: '${{ github.workspace }}/third_party/livewan'
      DMD_WAN21_TEST_UPSTREAM: '${{ github.workspace }}/third_party/wan21'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the pinned original data and meta-model sources, not weights
        run: git submodule update --init --depth 1 third_party/livewan third_party/wan21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install CPU data, checkpoint and original meta-constructor dependencies
        run: python -m pip install -e '.[train,test,native-wan]'
      - name: Actual input, resident/reference state and Gloo owners
        run: python -m pytest -q tests/test_training_livewan_inputs.py tests/test_training_livewan_state.py tests/test_training_livewan_reference.py tests/test_training_livewan_reference_distributed.py tests/test_training_native_state.py tests/test_refactor_livewan_context_staging.py --junitxml=livewan-inputs-cpu.xml
      - name: Require actual-source execution, not a skipped qualification
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('livewan-inputs-cpu.xml').getroot().iter('testcase'))
          assert cases and all(case.find('skipped') is None for case in cases)
          assert all(case.find('failure') is None and case.find('error') is None for case in cases)
          names = {case.get('name') for case in cases}
          assert {'test_actual_original_and_real_input_loader_roundtrip',
                  'test_complete_cohorts_rank_cursor_checkpoint_seek_and_rng',
                  'test_public_original_teacher_preparation_reaches_real_native_loader',
                  'test_native_original_read_uses_admitted_path_after_symlink_retarget',
                  'test_original_input_source_identity_is_exact_and_mismatch_fails',
                  'test_historical_default_prefix_behavior_is_unchanged',
                  'test_actual_owner_checkpoint_continuation_preserves_parameters_grad_views_hooks_rng[critic]',
                  'test_actual_owner_checkpoint_continuation_preserves_parameters_grad_views_hooks_rng[generator]',
                  'test_native_optimizer_rejects_raw_moment_cast_before_any_live_mutation',
                  'test_native_optimizer_raw_validation_does_not_impose_fixed_w4_policy',
                  'test_actual_original_wan_constructor_shapes_on_meta_only',
                  'test_real_cpu_dtensor_and_original_lora_adam_rng_in_place_continuation',
                  'test_hash_valid_wrong_adam_step_checkpoint_rejects_before_weights_rng_mutation',
                  'test_saved_cursor_rank_and_versions_cross_state_admission_is_premutation',
                  'test_actual_loader_cursor_consumes_once_and_only_after_success',
                  'test_dispatch_only_outer_lifecycle_reuses_actual_baseline_and_real_loads'} <= names
          assert sum(name.startswith('test_public_rank_local_preflight_failure_never_hangs_peer_or_constructs_model[')
                     for name in names) == 8
          assert sum(name.startswith('test_malicious_archive_refused_before_original_unsafe_loading[')
                     for name in names) == 2
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-livewan-inputs-cpu-${{ github.sha }}
          path: livewan-inputs-cpu.xml
