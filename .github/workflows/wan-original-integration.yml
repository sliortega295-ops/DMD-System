name: wan-original-integration
on:
  push:
    branches: [agent/unified-strategy-planner-20261012]
    paths: [.github/workflows/wan-original-integration.yml]
permissions:
  contents: write
jobs:
  bind-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind audited native source and record exact provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/distillschedule/bind_original_wan_arguments.py
      - run: python -m pip install -e '.[test]' torch==2.8.0 --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Native argument binding and original strategy regressions
        run: |
          python -m pytest -q tests/test_native_original_wan_invocation.py tests/test_refactor_original_wan_*.py tests/test_refactor_wan_parameterized_bridge.py --junitxml=/tmp/wan-original-tests.xml
          python scripts/distillschedule/check_best_known_integration.py
          git diff --check
      - name: Save tested native source and provenance on the isolated branch
        run: git push origin HEAD:agent/unified-strategy-planner-20261012
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-wan-binding-${{ github.sha }}
          path: /tmp/wan-original-tests.xml
          retention-days: 14
