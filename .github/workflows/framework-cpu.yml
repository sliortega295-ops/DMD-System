name: framework-cpu
on:
  pull_request:
    paths:
      - 'src/distillschedule/**'
      - 'tests/test_training_*.py'
      - 'tests/test_data_*.py'
      - 'examples/framework/**'
      - 'recipes/**'
      - 'scripts/check_framework_install.py'
      - 'pyproject.toml'
      - '.github/workflows/framework-cpu.yml'
  push:
    branches: [main, codex/open-source-framework-20261021]
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[train,test,test-helios]' wheel
      - name: Real media, updates, restart, extension and saved-plan execution
        env:
          PYTHONPATH: src:.
          CUDA_VISIBLE_DEVICES: ''
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q tests/test_data_*.py tests/test_training_*.py tests/test_open_workload_*.py --junitxml=framework-cpu.xml
      - name: Installed wheel outside the checkout
        run: python scripts/check_framework_install.py --output installed-framework.json
      - name: Lightweight wheel and original source admission
        run: |
          python scripts/check_wheel_install.py
          python scripts/distillschedule/check_best_known_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework-cpu-${{ matrix.python }}
          path: |
            framework-cpu.xml
            installed-framework.json
