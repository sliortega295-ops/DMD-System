name: core
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install core dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,test]'
      - name: Core tests
        run: python scripts/run_framework_cpu_tests.py --junitxml=core.xml
      - name: Installed command and lightweight discovery
        run: python scripts/check_wheel_install.py
      - name: Installed training, restart and output
        run: python scripts/check_framework_install.py --output installed-framework.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-python312
          path: |
            core.xml
            installed-framework.json
