name: h3-cached-reference-cpu
on:
  pull_request:
    paths:
      - 'src/distillschedule/**'
      - 'tests/test_h3_cached_*.py'
      - 'tests/test_data_h3_cached_inputs.py'
      - 'tests/test_training_h3_cached_public_cpu.py'
      - 'tests/test_training_h3_cached_inference_cpu.py'
      - 'tests/test_training_cpu_workflows.py'
      - 'recipes/h3_ar/**'
      - 'licenses/diffsynth-h3-cached/**'
      - 'pyproject.toml'
      - '.github/workflows/h3-cached-reference-cpu.yml'
  push:
    branches: [main, codex/open-source-framework-20261021]
permissions:
  contents: read
jobs:
  original-cached-av:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONPATH: 'src:.:tests'
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install minimum CPU Torch and the independent cached-source closure
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,test,h3-cached-reference]'
      - name: Actual cached AV, training, recovery and current-Student inference
        run: python -m pytest -q tests/test_h3_cached_source_provider.py tests/test_h3_cached_original_cpu.py tests/test_data_h3_cached_inputs.py tests/test_training_h3_cached_public_cpu.py tests/test_training_h3_cached_inference_cpu.py --junitxml=h3-cached-reference-cpu.xml
      - name: Require the actual-source proofs without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('h3-cached-reference-cpu.xml').getroot()
          suites = list(root.iter('testsuite'))
          assert suites and all(int(s.get(field, '0')) == 0 for s in suites
                                for field in ('skipped', 'failures', 'errors'))
          cases = list(root.iter('testcase'))
          assert cases and all(case.find('skipped') is None for case in cases)
          names = {case.get('name') for case in cases}
          required = {
              'test_lazy_identity_has_no_torch_or_native_diffsynth_imports',
              'test_manifest_pins_original_numerical_bytes_and_every_selected_ast',
              'test_actual_original_g1f1_update_census_and_immutable_references',
              'test_common_checkpoint_fresh_os_process_exact_gan_transition[False]',
              'test_common_checkpoint_fresh_os_process_exact_gan_transition[True]',
              'test_actual_original_direct_vs_public_exact_update_and_initialization',
              'test_factory_consumes_advanced_caller_rng_without_reseeding',
              'test_corrupt_common_restore_leaves_all_live_and_outer_rng_unchanged',
              'test_projection_is_student_only_nonmutating_and_next_update_exact',
              'test_common_export_actual_current_student_and_not_optimizer',
              'test_inference_factory_is_separate_and_torch_free_at_discovery',
              'test_fresh_process_only_export_and_NEW_conditions_no_C_Adam_old_reads[flat]',
              'test_fresh_process_only_export_and_NEW_conditions_no_C_Adam_old_reads[packed]',
          }
          assert required <= names, f'missing original cached-AV proofs: {sorted(required - names)}'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-cached-reference-cpu-py${{ matrix.python }}
          path: h3-cached-reference-cpu.xml
          if-no-files-found: error
