name: p0-unit

on:
  pull_request:
  push:

jobs:
  p0-unit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy
          python -m pip install -e .[test]
      - name: Run P0 tensor tests without skips
        run: |
          pytest -q tests/test_refactor_fsdp2_p0.py --junitxml=/tmp/p0-unit.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse('/tmp/p0-unit.xml').getroot()
          cases = list(root.iter('testcase'))
          tests = len(cases)
          skipped = sum(1 for case in cases if case.find('skipped') is not None)
          failures = sum(1 for case in cases if case.find('failure') is not None)
          errors = sum(1 for case in cases if case.find('error') is not None)
          if tests != 9 or skipped != 0 or failures != 0 or errors != 0:
              raise SystemExit(
                  f'P0 unit contract failed: tests={tests} skipped={skipped} '
                  f'failures={failures} errors={errors}; expected 9/0/0/0'
              )
          print('P0 unit contract PASS: 9 executed, 0 skipped')
          PY
